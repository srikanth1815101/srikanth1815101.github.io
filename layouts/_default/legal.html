{{ define "main" }}
<article class="py-10 md:py-16">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- Header (Exact from Blog Project) -->
        <header class="mb-12 text-center animate-fade-in-up">
            <h1
                class="font-display text-3xl sm:text-4xl md:text-5xl font-extrabold mb-4 pb-2 bg-gradient-to-r from-blue-600 via-fuchsia-500 to-pink-500 bg-clip-text text-transparent inline-block animate-gradient-sheen animate-hue-rotate">
                {{ .Title }}
            </h1>
        </header>

        <!-- Content (Exact Prose & Font from Blog Project) -->
        <div class="prose prose-lg dark:prose-invert max-w-none w-full mx-auto animate-fade-in-up">
            {{ .Content }}
        </div>
    </div>
</article>

<!-- Animations & Styling (Exact from Blog Project) -->
<style>
    @keyframes fadeInUp {
        0% {
            opacity: 0;
            transform: translateY(20px);
        }
        100% {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .animate-fade-in-up {
        animation: fadeInUp 0.6s cubic-bezier(.16, 1, .3, 1) both;
    }

    @keyframes gradientSheen {
        0% {
            background-position: 0% 50%;
        }
        100% {
            background-position: 100% 50%;
        }
    }

    .animate-gradient-sheen {
        background-size: 200% 200%;
        animation: gradientSheen 4s linear infinite alternate;
    }

    @keyframes hueRotate {
        0% {
            filter: hue-rotate(0deg);
        }
        100% {
            filter: hue-rotate(360deg);
        }
    }

    .animate-hue-rotate {
        animation: hueRotate 12s linear infinite;
    }

    /* Font styling exact as blog project */
    .font-display,
    .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif !important;
        letter-spacing: -0.02em;
    }

    /* Prose Overrides for Legal Pages (Cleaner, exact from blog project) */
    .prose {
        color: #1f2937;
        line-height: 1.75;
    }

    .dark .prose {
        color: #e5e7eb;
    }

    .prose h1, .prose h2, .prose h3, .prose h4, .prose h5, .prose h6 {
        font-weight: 700;
        line-height: 1.25;
        margin-top: 2rem;
        margin-bottom: 1rem;
        color: #111827;
    }

    .dark .prose h1, .dark .prose h2, .dark .prose h3, .dark .prose h4, .dark .prose h5, .dark .prose h6 {
        color: #f9fafb;
    }

    .prose h2 {
        font-size: 1.75rem;
        margin-top: 2.25rem;
        border-bottom: 1px solid #e5e7eb;
        padding-bottom: 0.5rem;
    }

    .dark .prose h2 {
        border-bottom: 1px solid #374151;
    }

    .prose p {
        margin-bottom: 1.25rem;
        line-height: 1.75;
    }

    .prose ul, .prose ol {
        margin: 1.25rem 0;
        padding-left: 1.5rem;
    }

    .prose li {
        margin: 0.5rem 0;
    }

    .prose a {
        color: rgb(59 130 246);
        text-decoration: underline;
        text-underline-offset: 2px;
        transition: color 0.15s ease;
    }

    .prose a:hover {
        color: rgb(37 99 235);
    }

    .dark .prose a {
        color: rgb(96 165 250);
    }

    .dark .prose a:hover {
        color: rgb(147 197 253);
    }

    .prose :not(pre) > code {
        background: rgb(243 244 246);
        padding: 0.125rem 0.35rem;
        border-radius: 0.375rem;
        font-size: 0.9em;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        color: rgb(17 24 39);
    }

    .dark .prose :not(pre) > code {
        background: rgb(31 41 55);
        color: rgb(243 244 246);
    }

    @media (prefers-reduced-motion: reduce) {
        .animate-fade-in-up, .animate-gradient-sheen, .animate-hue-rotate {
            animation: none !important;
            opacity: 1 !important;
            transform: none !important;
        }
    }
</style>
{{ end }}
