{{ define "main" }}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 md:py-12">
<article class="bg-white dark:bg-[#141B3D] p-6 sm:p-10 rounded-3xl border border-gray-100 dark:border-gray-700/50 shadow-xl my-4 animate-fade-in-up">
  <h1 class="text-3xl sm:text-4xl md:text-5xl font-black text-gray-900 dark:text-white tracking-tight mb-4">{{ .Title }}</h1>
  {{ with .Date }}
  <div class="text-xs sm:text-sm font-semibold text-gray-500 dark:text-gray-400 mb-8 pb-4 border-b border-gray-100 dark:border-gray-700/50 flex items-center gap-2">
    <i data-lucide="calendar" class="w-4 h-4"></i>
    <span>Last updated: {{ .Format "January 2, 2006" }}</span>
  </div>
  {{ end }}
  <div class="prose dark:prose-invert max-w-none prose-headings:font-black prose-headings:tracking-tight prose-a:text-blue-600 dark:prose-a:text-blue-400 leading-relaxed text-gray-700 dark:text-gray-300">
    {{ .Content }}
  </div>
</article>
</div>
{{ end }}
